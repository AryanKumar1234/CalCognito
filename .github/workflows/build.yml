name: Build APK (with hidden-app engine)

on:
  push:
  pull_request:
  workflow_dispatch:

# Lets the release step below create the tag and the GitHub release with the workflow's own token.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The project itself is committed as CalculatorApp.zip at the repo root (the checkout has no Gradle build), so
      # unpack it into the workspace before anything tries to run Gradle.
      - name: Extract committed project
        run: |
          unzip -q CalculatorApp.zip
          rsync -a --exclude '.github' --exclude 'local.properties' CalculatorApp/ ./
          ls -la

      # JDK 21: the engine (Bcore) is written for Java 21; the app itself still compiles for Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The engine is now part of this project (Bcore, black-reflection, compiler), so one Gradle build compiles its
      # native code too. Accepting the licences lets Gradle download the NDK the engine asks for (29.0.13846066).
      # Platform 35 is what the engine module compiles against; 36 is the app's.
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # Fails the run if the engine did not end up in the APK, so a build without it can never be published by accident.
      - name: Check the engine is inside the APK
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          if unzip -p "$apk" 'classes*.dex' | grep -aq 'top/niunaijun/blackbox/BlackBoxCore'; then
            echo "Engine classes included: yes" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The engine classes are NOT in the APK" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if unzip -p "$apk" 'classes*.dex' | grep -aq 'top/niunaijun/blackreflection/BlackReflection'; then
            echo "Engine libraries (BlackReflection) included: yes" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "BlackReflection is NOT in the APK: the engine would fail to start" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if unzip -l "$apk" | grep -q 'lib/arm64-v8a/libblackbox.so'; then
            echo "Engine native library (arm64-v8a): yes" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "libblackbox.so (arm64-v8a) is NOT in the APK" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Same app, not debuggable. A debuggable app runs with CheckJNI, which aborts the whole process on JNI
      # problems a normal build survives, so use this one on a phone.
      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Publishes both APKs as the "CalCognito v2.1" GitHub release. Runs for pushes and manual runs (not pull
      # requests), so the release always matches the commit that was just built.
      - name: Publish CalCognito v2.1 release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1
          name: CalCognito v2.1
          body: |
            CalCognito 2.1

            - CI builds the committed `CalculatorApp.zip` again (the workflow unpacks it before running Gradle).
            - Google Play services in the hidden space: cloning an app now offers to set Play services up for every app
              that actually uses it, not only for apps whose manifest carries the GMS marker. Google's own apps (the
              Google app, Maps, YouTube) never had that marker, so they were cloned into the space without Play
              services and then showed "Google Play services isn't supported on this device". The app's code is now
              searched for Play services classes (cached per app version) and the question is answered off the UI thread.
            - Apps cloned before this update: open the Apps folder, tap the Google Play services row, Set up, then
              close and reopen the clone.

            2.0 changes, still included:

            - Removed the hidden-app engine's inherited permissions: SMS/MMS, contacts, call logs, calendar, location,
              camera, microphone, sensors, accounts and the system-only permissions a normal app can never hold. Only
              the permissions the calculator and the file vault actually use remain.
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          
