name: Delete old build-log releases

# One-off cleanup, removed again once it has run.
on:
  push:
    paths:
      - '.github/workflows/cleanup-build-logs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the failed-build log releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in build-log-221 build-log-224 build-log-225; do
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
            echo "release $tag -> HTTP $code"
            tagcode=$(curl -sS -o /tmp/tag.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag")
            echo "tag $tag -> HTTP $tagcode"
          done
          echo "done"
